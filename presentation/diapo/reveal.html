<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Self Hosted Cloud Implementation</title>
    <link rel="stylesheet" href="assets/reveal.css">
  </head>
  <body>
    <main class="presentation-shell" aria-label="Presentation Self Hosted Cloud Implementation">
      <section class="deck" id="deck" aria-live="polite"></section>

      <nav class="deck-nav" aria-label="Navigation des diapositives">
        <button class="nav-btn" id="prev" type="button" aria-label="Diapositive precedente">
          <span aria-hidden="true">←</span>
          <span>Precedent</span>
        </button>

        <div class="progress-wrap">
          <div class="dots" id="dots"></div>
          <div class="counter" id="counter"></div>
        </div>

        <button class="nav-btn" id="next" type="button" aria-label="Diapositive suivante">
          <span>Suivant</span>
          <span aria-hidden="true">→</span>
        </button>
      </nav>
    </main>

    <script src="slides.js"></script>
    <script src="assets/reveal.js"></script>
  </body>
</html>
